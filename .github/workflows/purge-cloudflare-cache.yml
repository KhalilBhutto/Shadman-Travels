name: Purge Cloudflare Cache

# Runs after GitHub's own "pages-build-deployment" workflow finishes
# successfully, so the cache is cleared only once the new site is live.
# You can also run it by hand from the Actions tab (Run workflow).
on:
  workflow_run:
    workflows: ["pages-build-deployment"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  purge-cache:
    # Skip if the Pages deployment failed (a manual run always goes ahead).
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Purge Cloudflare cache
        run: |
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
